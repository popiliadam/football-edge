# Faz 0 başlangıç seti. Faz 1'de genişler, Faz 2'de piyasa verimliliği
# ölçümüne göre budanır. odds_api_key değerleri /v4/sports çıktısından doğrulanmalı.
leagues:
  - id: eng.1
    odds_api_key: soccer_epl
    name: Premier League
    country: England
    lang: en
    gl: GB
    active: true
    footystats_path: /england/premier-league/xg
  - id: esp.1
    odds_api_key: soccer_spain_la_liga
    name: La Liga
    country: Spain
    lang: es
    gl: ES
    active: true
    footystats_path: /spain/la-liga/xg
  - id: ita.1
    odds_api_key: soccer_italy_serie_a
    name: Serie A
    country: Italy
    lang: it
    gl: IT
    active: true
    footystats_path: /italy/serie-a/xg
  - id: ger.1
    odds_api_key: soccer_germany_bundesliga
    name: Bundesliga
    country: Germany
    lang: de
    gl: DE
    active: true
    footystats_path: /germany/bundesliga/xg
  - id: fra.1
    odds_api_key: soccer_france_ligue_one
    name: Ligue 1
    country: France
    lang: fr
    gl: FR
    active: true
    footystats_path: /france/ligue-1/xg
  - id: tur.1
    odds_api_key: soccer_turkey_super_league
    name: Super Lig
    country: Turkey
    lang: tr
    gl: TR
    active: true
    footystats_path: /turkey/super-lig/xg
  # ── İz A (2026-09-23): Faz 2 lig önerisi, kullanıcı onaylı (N1, B1, AUT) ─────────────
  # `active: false` = The Odds API KREDİ ANAHTARI KAPALI. snapshot/seal/fetch-results yalnız
  # `active: true` ligleri çağırır; açmak (true) snapshot + mühür kredisi harcar ve
  # footystats'ı da açar — kullanıcı kararı (bütçe 500/ay; hesap: .superpowers/sdd/
  # 2026-09-23-leagues-n1-b1-aut/izA-report.md). Açmadan ÖNCE `config/sources.yaml`
  # footystats `declared_paths`ine aşağıdaki üç yol eklenmeli — kapı
  # (`test_each_collectors_fetched_path_is_declared`) eklenmemişse kırmızı verir.
  # odds_api_key: ölçüm belgesi §2.5 (`/v4/sports?all=true`, 0 kredi) = history_leagues.yaml.
  # footystats_path: 2026-09-23'te `collector._guarded_get` ile ölçüldü (robots izinli, 200,
  # `xg-all` tablosu 18/18/12 takım). lang/gl bugün yalnız `leagues` aynasına yazılır;
  # Belçika iki dilli (nl/fr) — nl seçildi, hiçbir toplayıcı henüz okumuyor.
  - id: ned.1
    odds_api_key: soccer_netherlands_eredivisie
    name: Eredivisie
    country: Netherlands
    lang: nl
    gl: NL
    active: false
    footystats_path: /netherlands/eredivisie/xg
  - id: bel.1
    odds_api_key: soccer_belgium_first_div
    name: First Division A
    country: Belgium
    lang: nl
    gl: BE
    active: false
    footystats_path: /belgium/pro-league/xg
  - id: aut.1
    odds_api_key: soccer_austria_bundesliga
    name: Bundesliga
    country: Austria
    lang: de
    gl: AT
    active: false
    footystats_path: /austria/bundesliga/xg
