# Faz 4 canlı ayağın ön kaydı — Plan 3 spec `docs/superpowers/specs/2026-10-05-faz4-plan3-onkayit-design.md`
# (R188–R199). Bu dosyanın commit'i + açıklamalı `faz4-onkayit` etiketi MÜHÜRDÜR: ilk kademe 2 turundan
# (2026-10-09 12:35 UTC) önce, hiçbir Jev'li ΔLL ya da `harman_jev` olasılığı hesaplanmadan. Değiştirilirse
# ön kayıt bozulur. Yükleyici `football_edge.gate4.preregistration`, mühür denetimi `football_edge.gate4.seal`
# (`tests/test_gate4_preregistration.py`). Değerlendirme raporu `comparisons` + `counts_printed`ı BİREBİR basar.
phase: faz4
leg: live
seal_tag: faz4-onkayit

# R193: pencere = bu kümenin, ilk `side_status` işaretinin asked_at'i mühür commit'inin committer saatinden
# sonra olan kararları. tier2_prompt_version = sha256(bytes(jev_questions.yaml) + bytes(faz4_live.yaml)).
window:
  tier2_prompt_version: 9b294a616fd62e867c92aa05cc7dc9661090d484a70aaf11f550df8341980c5e
  start: first_asked_after_seal_commit

# R193/R194: kapanış turu = haberli karar sayısının (sonuçtan bağımsız) ilk kez ≥ n_stop olduğu tur ya da
# decided_at ≤ date_limit olan son tur; eşitlikte n_stop. Değerlendirme kapanış turunun decided_at'i + 21 gün.
stop:
  n_stop: 1800
  date_limit: 2027-06-30T23:59:59Z
  tie: n_stop
  evaluation_lag_days: 21

# R189/R190/R199: f = Z_dep − Z_ev, Z = (Σ weakness − Σ strength) / divisor; seviye = Jev'in seçtiği düzey
# (none 0, low 1/3, medium 2/3, high 1); sorulmayan taraf "yok" (0); başlama sonrası cevap eksik.
feature:
  weakness: [t2_hucum_eksik, t2_savunma_eksik, t2_orta_saha_eksik, t2_kaleci_eksik, t2_supheli, t2_rotasyon]
  strength: [t2_donus]
  excluded: [t2_hoca_degisim, t2_yeni_transfer]
  divisor: 7
  sign: away_minus_home
  level_score: choice
  c_min: 0.0
  asked_after_kickoff: missing

# R190: düzey → sayı (`features.derive.LEVEL_SCORES` ile birebir; mühür denetimi zorlar).
level_scores:
  none: 0.0
  low: 0.3333333333333333
  medium: 0.6666666666666666
  high: 1.0

# R191: β_i = argmax_{lower ≤ β ≤ upper} Σ_{j∈T_i} log p_jev,j(β)[y_j] − λβ²/2; T_i boşsa `empty`.
# T_i: commence_time_j ≤ decided_at_i − gap_hours VE football-data tarihi_j < UTC tarihi(decided_at_i).
beta:
  lambda: 1.0
  lower: 0.0
  upper: 5.0
  solver: projected_bisection
  tol: 1.0e-10
  empty: 0.0
  train:
    gap_hours: 3
    result_date: strictly_before_decision_utc_date
    requires: [haberli, harman_complete, settled, in_window, gate_language]

# Spec §1. D1 kapıdır; ötekiler betimsel (D3 ikincil). D8/D10 sınırı iki yönlü.
comparisons: [D1, D1b, D1c, D2, D3, D5, D6, D7, D8, D9, D10]
gate: D1
descriptive_bounds:
  lower: -5.0
  upper: 5.0
d8_questions:
  - t2_hucum_eksik
  - t2_savunma_eksik
  - t2_orta_saha_eksik
  - t2_kaleci_eksik
  - t2_supheli
  - t2_rotasyon
  - t2_donus
  - t2_hoca_degisim
  - t2_yeni_transfer
  - t3_oncelik
  - t3_hoca_baskisi
  - t3_derbi_gerilim
  - t3_dead_rubber
  - t3_taktik_degisim
  - t3_seyirci_kisiti
  - t3_saha_zemini
  - t3_milli_donus
  - t3_kart_siniri
d5_leagues: [eng.1, esp.1, ita.1, ger.1, fra.1, tur.1, ned.1, bel.1]

# market.metrics.bootstrap_mean; girdi (decided_at, match_id) artan; her karşılaştırma tek çağrı, aynı tohum.
bootstrap:
  resamples: 10000
  seed: 20261005
  level: 0.95
  order: [decided_at, match_id]
tau: 0.02
calibration_bins: 10

# Spec §1: hesap yöntemleri — değerlendirme kodu yalnız bunları uygular. LL tabanı 1e-15 (`per_match_log_loss`);
# bootstrap yüzdelik, maç düzeyi; D1b karar turu kümeli; D3 plasebosu; D9 baz − piyasa SD'si (ddof 1, ilk 4 hafta);
# D10 kapsam plasebosu f_cov = 1[ev asked] − 1[dep asked].
methods:
  log_loss: market.metrics.per_match_log_loss
  bootstrap: market.metrics.bootstrap_mean
  d1b: round_cluster
  d3_placebo: backtest.strategies.Placebo
  calibration: market.metrics.calibration_or_none
  d9_sd_ddof: 1
  d9_sd_weeks: 4
  d10_feature: coverage_indicator

# Spec §2/§5: kapanış türleri (renderer `closure_kind` olarak basar).
closure_kinds: [n_stop, date, vendor, user]

# R195: mühürde tr. Başka dil yalnız mühürlü jev_model'le bu eşiği geçen kalibrasyon raporu commit'inden
# sonraki turlardan itibaren kapı kitlesine girer; eşiksiz giriş kullanıcı kaynaklı kesintidir (spec §5).
languages:
  sealed: [tr]
  entry:
    min_n: 100
    min_accuracy: 0.85
    jev_model: jev-1.13.0

