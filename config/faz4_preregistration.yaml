# Spec §1 "basılan sayımlar" — renderer bu listeyi birebir basar.
counts_printed:
  - window_start
  - seal_tag_sha
  - preregistration_sha256
  - closure_kind
  - closing_round
  - evaluation_date
  - closing_haberli_decisions
  - d1_n
  - n_stop
  - shadow_matches
  - haberli_matches
  - incomplete
  - rejected_price
  - fallback_leagues
  - unsettled
  - no_decision
  - side_status
  - imputed_sides
  - asked_after_kickoff
  - missing_by_question
  - language_excluded
  - league_excluded
  - item_set_hash_mismatch
  - outside_frozen_set
  - language_entry_reports
  - arm_changes

# Spec §2.
verdicts:
  passed: "GEÇTİ — D1 GA alt sınırı > 0 ve kapanış kullanıcı kaynaklı değil"
  failed: "KALDI — D1 GA üst sınırı < 0, ya da pencere n_stop sayımıyla kapandı ve GA alt sınırı ≤ 0"
  underpowered: "GÜÇ YETERSİZ — öteki her durum: tarih/satıcı kapanışında GA sıfırı içeriyor, kullanıcı kapanışında GA üst sınırı ≥ 0 ya da D1 boş"
