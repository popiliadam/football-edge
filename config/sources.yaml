  - id: openmeteo
    base_url: https://api.open-meteo.com
    user_agent: football-edge/0.1
    crawl_delay_seconds: 1.0
    robots_verified_at: 2026-09-19
    declared_paths: ['/v1/forecast']
    enabled: true
    access_basis: api_terms
    terms_url: https://open-meteo.com/en/terms
    note: >-
      AÇILDI (R8 — plan hatası düzeltildi). api.open-meteo.com/robots.txt gerçekten
      "User-agent: * / Disallow: /" (25 bayt, ölçüldü) — ama bu bir API SUNUCUSU, insan
      için sayfa sunan bir web sitesi değil. Robots Exclusion Protocol TARAYICILARI hedefler
      (spec §3.2/1); belgelenmiş, anahtarsız bir API'nin istemcisi ayrı bir sınamaya tabidir
      (§3.2/3, ToS). Understat emsali BURAYA taşınmaz: Understat insan için HTML sayfası
      sunuyor, Open-Meteo programatik kullanım için API yayınlıyor. access_basis=api_terms bu
      ayrımı koda taşır — robots.txt bu kaynak için hiç sorulmaz, terms_url ZORUNLUDUR ve
      audit_offline onun varlığını zorlar (yoksa kapı kırmızı verir). Crawl-delay 1.0 kendi
      seçtiğimiz nezaket payı (robots'ta bildirilmiyor, önceki 0.0 artık uygun değil).

  - id: wikidata
    base_url: https://www.wikidata.org
    user_agent: football-edge/0.1 (+https://github.com/popiliadam/football-edge)
    crawl_delay_seconds: 1.0
    robots_verified_at: 2026-09-19
    declared_paths: ['/wiki/Special:EntityData/Q170980.json']
    enabled: false
    access_basis: robots
    terms_url: ''
    note: >-
      HÂLÂ KAPALI — R7'nin teşhisi doğrulandı ve düzeltildi, ama kapı hâlâ geçmiyor
      (Task 3 revizyonu, bkz. task-3-report.md). Önceki declared_paths
      (/wiki/Special:EntityData, çıplak önek) hiç fetch EDİLMEYEN bir yoldu — düzeltildi:
      gerçekte fetch edilen yol /wiki/Special:EntityData/<QID>.json'dur (Q170980 = Task 7'nin
      fixture'ındaki stadyum). Ayrıca gerçek robots.txt'te satır 422/423/425'teki boş
      satırların `RobotFileParser`ın blok birikimini SESSİZCE kestiğini bulup düzelttik
      (sources.robots_for, artık boş satırları eliyor). AMA bu iki düzeltmeden SONRA bile
      `allows()` bu tam yol için False dönüyor — ÖLÇÜLDÜ, varsayılmadı: satır 436'daki
      "Allow: /wiki/Special:EntityData/*." kuralı stdlib'in KENDİ, ayrı iki sınırına birden
      çarpıyor (dosya-sırasında ondan ÖNCE gelen geniş bir Disallow kazanıyor VE joker `*`
      quote()'tan geçip eşleşmez oluyor — bkz. sources.allows() docstring, DEFERRED §5.5).
      Koordinatörün kendi ölçümü bu tam yolu izinli buluyor (muhtemelen RFC 9309 uyumlu,
      en-özgül-kazanır bir araçla) — anlaşmazlık robots.txt'in NASIL okunacağı üzerine değil,
      stdlib'in bunu YANLIŞ okuduğu üzerine. `enabled: true` yapmak şu an kapıyı KIRMIZI
      yapardı; kapı gevşetilmez. Kalıcı çözüm joker-duyarlı bir ayrıştırıcı (DEFERRED §5.5'te
      izlenen follow-up) ya da koordinatörün açık bir sonraki kararı.

