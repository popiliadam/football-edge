# Kaynak kayıt defteri. `declared_paths`, toplayıcının GERÇEKTEN istediği yollardır ve kapı
# her push'ta bunları config/robots/<id>.txt'ye karşı sorar. Yeni bir yol eklemeden önce
# robots'a bak; kapı zaten bakacak. `declared_paths` GERÇEKTEN FETCH EDİLEN URL'ler olmalı,
# önek DEĞİL (R7): bir önek, kapının hiç istenmeyecek bir yolu sınamasına yol açar — izinli
# bir kaynağı yanlışlıkla kapatabilir ya da (daha kötü) izinsiz bir yolu yanlışlıkla geçirebilir.
#
# Ölçüm tarihi 2026-09-19. `robots_verified_at` 30 günden eskiyse kapı kırmızı verir —
# tazelemek için Task 3 Step 5'teki komutu yeniden koş ve tarihleri güncelle.
#
# access_basis: `robots` (varsayılan) ya da `api_terms`. Spec §3.2 kendi içinde ayırıyor:
# madde 1 robots.txt'i TARAYICILAR için tanımlar, madde 3 ise ToS'u AYRI bir sınama olarak ele
# alır (R8). `api_terms` kaynaklarda robots.txt hiç sorulmaz — `terms_url` ZORUNLUDUR ve kapı
# onun varlığını zorlar (bkz. sources.audit_offline).
#
# BİLİNEN SINIR (bkz. src/football_edge/sources.py:allows): `urllib.robotparser` joker
# karakter (`*`/`$`) DESTEKLEMEZ ve birden çok kural çakıştığında dosya sırasındaki İLK
# eşleşen kuralı kullanır (RFC 9309'un "en özgül kazanır" kuralını değil). `declared_paths`e
# bu tuzaklara düşen bir yol eklemeyin; kapı onu sessizce ATLAR (yakalamaz), engellemez.
sources:
  - id: footystats
    base_url: https://footystats.org
    user_agent: football-edge/0.1 (+https://github.com/popiliadam/football-edge)
    crawl_delay_seconds: 2.0
    robots_verified_at: 2026-09-19
    declared_paths: ['/turkey/super-lig/xg']
    enabled: true
    access_basis: robots
    terms_url: ''
    note: >-
      KULLANICI-ETKENİ DEĞİŞTİ (R9 — plan hatası düzeltildi, en ciddi olanı). Plan
      `User-agent: ClaudeBot` kullanıyordu çünkü footystats'ın gerçek robots.txt'i ona
      Disallow'suz, yalnız `Crawl-delay: 1` veren kendi grubunu ayırıyor — ama ClaudeBot
      Anthropic'in tarayıcısı, biz Anthropic değiliz. O kimliği takınıp Anthropic'e verilen
      izni almak user-agent sahtekârlığıdır; doğrulanabilir dürüstlük iddia eden bir üründe
      savunulamaz. Artık dürüstçe KENDİ kimliğimizle tanımlanıyoruz ve `User-agent: *`
      grubuna uyuyoruz. O grup Crawl-delay bildirmiyor; 2.0 saniye kendi seçtiğimiz temkinli
      değer (ClaudeBot grubunun 1'inden temkinli). Ölçüldü: altı lig xg yolu da bu grup
      altında izinli (/england/league-one ve /league-two hariç, onlar zaten kapalı) — dürüst
      kimliğin bedeli sıfır. Yalnız Türkiye şu an toplanıyor, declared_paths bunu yansıtıyor.

