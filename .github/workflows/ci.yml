name: ci

# PROJENİN KAPISI BUDUR. `.github/workflows/` uzun süre yalnız `snapshot.yml` ve
# `seal.yml` taşıdı; ikisi de `schedule` + `workflow_dispatch`. Yani dokümantasyon
# yedi adımlık bir kapıyı anlatırken CI'ın gerçekten koştuğu tek adım secret
# taramasıydı. Merge sonrası bozuk bir push 15 dakikalık mühür cron'una KAPISIZ
# ulaşır ve kalıcı, yanlış etiketli satırlar yazar — defter append-only, o satırlar
# silinemez. Kapı push anında koşmalı, tur koşmadan önce.
on:
  push:
  pull_request:

concurrency:
  # snapshot/seal'in `odds-collect` grubundan AYRI: bu iş deftere hiç dokunmaz,
  # onları beklemesi için bir sebep yok. Ref başına eskisi iptal edilir: yalnız
  # dalın SON hâlinin yeşil olması anlamlıdır.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Salt okunur. Bu iş hiçbir şey commit'lemez; `seal.yml`'in `contents: write`
  # yetkisi yalnız çıpa yayını içindir ve buraya sızmaz.
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    # Site test kabı (imaj çekme + hazır olma) ve `site-db` adımı eklendi (Faz 6 B-1 Task 9). Önce
    # kapı 75 sn sürüyordu (CI, 2026-09-24); kap adımı ve yeni DB testleri yerelde ölçüldü (Task 9
    # raporu). CI'daki ilk ölçüme dek taban 20 dk: soğuk 1,8 GB imaj çekmesi ölçülmedi.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Bu iş push'lamaz: token `.git/config`te kalmasın (üçüncü taraf adımlar okuyabilir).
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      # `uv sync --frozen` ŞART: kapının `paket-kurulu` adımı `PYTHONPATH` boşken
      # KURULU paketi import eder. Kurulum olmadan o adım düşer — ve düşmesi
      # doğrudur, çünkü workflow'lar `python -m football_edge.collect` ile tam da
      # kurulu paketi çağırıyor.
      # `--extra scrape` (Scrapling `fetchers`, oturum 9 Task 3): yalnız bu iş kurar. Soğuk
      # önbellekte `uv sync --frozen` 1,9 sn / 217 MB iken ekstrayla 44,8 sn / 544 MB ölçüldü;
      # 15 dakikada bir koşan zamanlanmış işler (`seal`, `snapshot`, …) ekstrasız hafif kalır.
      # Kapı ekstrasız koşarsa `mypy`, `pytest` ve `paket-kurulu` (`football_edge.scrape`)
      # kırmızı verir — sessiz geçmez.
      - run: uv sync --frozen --extra scrape
      # Faz 6 İz B §12.2/B10: sitenin katalog, davranış ve uçtan uca testleri gerçek Postgres ister.
      # Kap bu işin içinde doğar ve ölür; imaj T0'da ölçülüp sabitlendi (`docs/phases/06-site/
      # b1-t0-olcumler.md`, tek kaynak — test eşitliği sınar). Parola burada üretilir: depo secret'ı
      # DEĞİLDİR (`test_ci_reads_no_repository_secret_at_all`) ve maskelenir. Adres yalnız
      # 127.0.0.1'i gösterir (koşucunun kendi Postgres'iyle çakışmasın diye 55432); test düzeni başka
      # adresi reddeder. Aynı kap 0013'ün kum havuzu testlerini de koşar (DEFERRED 18a).
      # `DATABASE_URL` yine VERİLMEZ: katalog testleri adıyla SKIP.
      # Kap logu BASILMAZ: imaj ilk kurulumda parolayı kendi loguna yazar ve maskeleme yalnız bu
      # adımın çıktısını kapsar. Kap kalkmazsa yalnız durumu basılır (`test_ci_never_prints_the_
      # container_log`).
      - name: Site test veritabanı
        env:
          SITE_DB_IMAGE: public.ecr.aws/supabase/postgres:17.6.1.143@sha256:80d7b27c3e8d77cfa7226eee9508671796da214781ff15a35b3670d7ad5ee453
        run: |
          password="$(openssl rand -hex 16)"
          echo "::add-mask::${password}"
          docker run -d --name fe-site-db -e POSTGRES_PASSWORD="${password}" \
            -p 127.0.0.1:55432:5432 "${SITE_DB_IMAGE}" postgres -D /etc/postgresql
          for attempt in $(seq 1 90); do
            if docker exec -e PGPASSWORD="${password}" fe-site-db \
              psql -h localhost -U postgres -d postgres -Atc 'select 1' >/dev/null 2>&1; then
              address="postgresql://postgres:${password}@127.0.0.1:55432/postgres"
              # Adlar parçalardan: kapının secrets taraması `AD=değer` biçimini arar.
              for name in "SITE_TEST_DATABASE""_URL" "SANDBOX_DATABASE""_URL"; do
                echo "${name}=${address}" >> "${GITHUB_ENV}"
              done
              echo "site test veritabanı hazır (deneme ${attempt})"
              exit 0
            fi
            sleep 2
          done
          echo "HATA: site test veritabanı 180 sn'de hazır olmadı"
          docker container inspect -f 'durum={{.State.Status}} çıkış={{.State.ExitCode}} oom={{.State.OOMKilled}}' fe-site-db
          exit 1
      - name: Kapı
        env:
          # `verify.sh` logu `${TMPDIR:-/tmp}` altına yazar. Runner'da `TMPDIR`
          # tanımlı değildir; sabitlenmezse log /tmp'ye düşer ve aşağıdaki yükleme
          # adımı yanlış yere bakar — yani tam da kırmızı koşuda çıktı kaybolur.
          TMPDIR: ${{ runner.temp }}
        # SECRET VERİLMEZ — `DATABASE_URL` de `ODDS_API_KEY` de yok. İkisi de
        # kasıtlı:
        #   - `DATABASE_URL`: kapının `zincir` adımı CANLI deftere bağlanırdı ve
        #     her fork PR'ı üretim veritabanına erişmiş olurdu. Defter append-only,
        #     her yazma kalıcı.
        #   - `ODDS_API_KEY`: her push ücretli çağrı demek olurdu (ayda 500 kredi).
        # Kapı secret'sız DOĞRU biçimde bozulur: `zincir` adımı
        # "SKIP: zincir (DATABASE_URL yok)" basar — ATLANAN KONTROL GEÇMEK DEĞİLDİR,
        # bu yüzden adıyla yazılır ve log'da görünür. Geri kalan on bir adım koşar:
        # ruff-check · ruff-format · mypy · pytest · paket-kurulu · kaynak-politikası ·
        # veri-sözleşmesi · sızıntı · site-db · dil-kalibrasyonu · secrets.
        #
        # `zincir` adımının gerçekten koştuğu tek yer `seal.yml`'dir (her 15 dakika,
        # varsayılan dalda, kendi secret'ıyla). Bu boşluk HANDOFF §3'te yazılıdır.
        run: ./verify.sh
      - name: Kapı logunu yükle
        # `verify.sh` özet basar, ayrıntıyı log dosyasına yazar ve projenin kuralı
        # "çıktı DOSYADAN okunur". `if: always()` olmadan log tam da okunması
        # gereken koşuda — kırmızıda — kaybolur.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-log
          path: ${{ runner.temp }}/football-edge-verify.log
          if-no-files-found: warn
# Dal filtresi KASITLI olarak yok: kapıya filtre eklemek onu zayıflatır. `seal.yml`in çıpa
# commit'leri yine de CI koşusu DOĞURMAZ: bot `GITHUB_TOKEN` ile push'lar ve GitHub bu
# push'lardan yeni workflow tetiklemez (2026-09-22 ölçüldü: CI yalnız insan push'larında
# koştu). Çıpa da yalnız zincir başı değiştiğinde ya da yeni UTC gününde commit'lenir.
