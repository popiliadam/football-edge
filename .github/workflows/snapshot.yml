name: snapshot

on:
  # TEK tetik pg_cron: her gün 06:22 UTC'de `ops.dispatch_snapshot()` bu workflow'u
  # `workflow_dispatch` ile çağırır (db/migrations/0004_workflow_dispatch.sql). GitHub
  # `schedule`ı KASITLI olarak yok: ikisi birden aynı gün iki tur, yani iki kat kredi demektir.
  # pg_cron sessizce durursa `seal.yml`deki bekçi (scripts/ops_alert.py watchdog) alarm açar.
  #
  # KREDİ ARİTMETİĞİ (ücretsiz katman: 500 kredi/ay, maliyet = markets × regions = 1; olay
  # dönmeyen çağrı 0 kredi — ölçüldü, milli maç arasında snapshot bedava):
  #   config/leagues.yaml → 8 aktif lig × 1 kredi = 8 kredi/tur (R125: +N1, +B1; AUT kapalı)
  #   1 tur/gün × 30 gün                          = 240 kredi/ay (31 günde 248)
  #   mühür: ligin AYRI başlama saati başına 1 kredi. 8 lig ≈ 75 maç/hafta × 4,3 ≈ 323 maç/ay
  #     üst sınır (her maç ayrı saatte)           ≈ 323 → toplam ≈ 563 kredi/ay — BÜTÇEYİ AŞAR
  #     beklenen (canlı DB, 09-19/20 haftası: 51 maç / 34 ayrı başlama = 0,67) ≈ 215
  #                                                → toplam ≈ 455 kredi/ay, pay ≈ 45
  # Pay dar: tükenirse (<5) mühür turu keser ve TÜM liglerin kapanışı KALICI kaçar. Bekçi
  # 60'ın altında alarm açar. İkinci bir günlük tetik 240 kredi daha yer — bütçeyi aşar. Lig
  # ya da sıklık artırılacaksa önce bu aritmetik yeniden yapılır — kredi sessizce tükenir.
  workflow_dispatch:

concurrency:
  # seal.yml ile AYNI grup: iki tur defteri aynı anda yazamaz.
  group: odds-collect
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Job düzeyi üst düzeyi TAMAMEN ezer: checkout için `contents: read` burada da yazılı.
      contents: read
      # Alarm issue'su açar/kapatır (scripts/ops_alert.py).
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Secret taraması
        # Depo PUBLIC: commit'e kaçan bir secret insan kontrol noktası olmadan anında
        # halka açılır ve geri alınamaz — push'lanmış anahtar yanmıştır, silmek yetmez.
        # Tarama yalnız `./verify.sh` içinde, yalnız yerelde koşuyordu; kapıyı elle
        # koşmayan bir push taramadan geçmeden iniyordu. Ucuz ve credential istemez,
        # bu yüzden kurulumdan da ÖNCE: kaçak secret runner'ın geri kalanına ulaşmasın.
        run: ./scripts/check_secrets.sh
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - name: Oranları çek
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set +e
          uv run python -m football_edge.collect snapshot
          code=$?
          set -e
          case "$code" in
            0) echo "tur tamam" ;;
            2) echo "::error::kredi tükendi (exit 2) — aylık bütçe bitti, tur erken kapandı" ;;
            3) echo "::error::en az bir lig toplanamadı (exit 3) — diğer ligler yazıldı" ;;
            4) echo "::error::lig aynası tazelenemedi (exit 4) — tur hiç başlatılmadı, kredi harcanmadı" ;;
            *) echo "::error::snapshot beklenmedik kodla düştü (exit $code)" ;;
          esac
          # Hiçbir kod yutulmaz: 2 de 3 de işi kırmızıya düşürür, yalnız adıyla.
          exit "$code"
      - name: Alarm aç
        # Önceki HERHANGİ bir adım kırmızıysa `ops-alert` issue'su açılır; açıksa yalnız
        # gövdesi güncellenir (her tur yeni bildirim üretseydi alarm gürültüye gömülürdü).
        # `cancelled()`: zaman aşımı turu iptal eder ve `failure()` yanlış döner.
        if: ${{ failure() || cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: uv run python scripts/ops_alert.py fail --workflow snapshot --run-url "$RUN_URL"
      - name: Alarm kapat
        # Kapatma düşerse (ör. GitHub 5xx) yeşil tur kırmızıya dönmez; açık alarm sonraki yeşil
        # turda kapanır.
        if: success()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: uv run python scripts/ops_alert.py ok --workflow snapshot --run-url "$RUN_URL"
