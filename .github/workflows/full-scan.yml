name: full-scan

# Defterin İÇİ hiçbir zamanlanmış koşuda yeniden hash'lenmiyordu: `seal.yml` yalnız en yeni
# çıpadan SONRAKİ kuyruğu tarar ve çıpalar hep ileri gider (DEFERRED §1.1). Haftada bir tam
# tarama, o boşluğu kapatan tek şeydir. Maliyeti gerçek ve büyüyor — 3 717 satır bugün ucuz,
# 12 ayda değil; pahalılaştığında AYLIK yapılır, kapı gevşetilmez.
on:
  schedule:
    - cron: "23 4 * * 0"   # Pazar 04:23 UTC — mühür turlarının en seyrek olduğu saat
  workflow_dispatch:

# concurrency: BİLİNÇLİ OLARAK YOK — `seal.yml`in `odds-collect` grubuna girmez.
# Bu iş SALT OKUNUR: hiçbir advisory lock almaz (yalnız `insert_snapshots` alır) ve
# eşzamanlı okuyucularla yazarlar Postgres MVCC altında çakışmaz. Önceki hâl bu işi
# `odds-collect` grubuna sokuyordu ("mühür turuyla yarıştırmaya gerek yok" diye) — ama
# GitHub aynı gruptaki bekleyen bir koşuyu, yenisi geldiğinde İPTAL EDER: 30 dakikalık
# bir tam tarama `seal.yml`in 15 dakikalık turlarından birini kuyruğa dizip iptal
# ederdi. Mühür penceresi 20 dakika ve kaçan mühür KALICI kayıp (`EXIT_MISSED_SEAL`,
# bkz. seal.yml) — Faz 0'ın var olma sebebi tam da bunu önlemekti. Pazar 04:23 UTC
# olasılığı azaltır, ortadan kaldırmaz; defter büyüdükçe tarama süresi de büyür.
permissions:
  contents: read

jobs:
  full-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Çıpa eksikliği kontrolü `git log` okur; sığ klon geçmişi görmez ve kontrol
          # SESSİZCE atlanır. Atlanan kontrol geçmek değildir — bu yüzden tam geçmiş.
          fetch-depth: 0
          # Yalnız yerel `git log` okunur, push yok: token `.git/config`te kalmasın.
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - name: Tam zincir taraması
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python -m football_edge.collect verify-chain --full
