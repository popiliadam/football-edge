[project]
name = "football-edge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "protego>=0.3",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "defusedxml>=0.7",
    "typesafe-sdk>=0.1",
    "numpy>=2.1",
    "scipy>=1.14",
]

[project.optional-dependencies]
scrape = [
    "scrapling[fetchers]>=0.4.15",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "types-beautifulsoup4",
    "types-defusedxml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/football_edge"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "contract: kaydedilmiş fixture üzerinde tazelik/şema sözleşmesi",
    "leakage: zaman semantiği, dönem ayrımı, kilit ve bağlam/sonuç ayrımı — kapının sızıntı adımı sayar",
    "sitedb: atılabilir yerel Postgres kabı ister (SITE_TEST_DATABASE_URL) — kapının site-db adımı koşar",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "T20"]

[tool.ruff.lint.per-file-ignores]
# `sitedb` fixture'ları `tests/site_db.py`de yaşar (spec §4.4/4); test modülü onları import eder ve
# parametre adıyla kullanır — pyflakes bunu kullanılmayan/yeniden tanımlanan ad sanar.
"tests/test_site_*_db.py" = ["F401", "F811"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "scripts"]

# scipy tip bilgisi taşımaz (Faz 3 dalga 0): dönüşleri çağıran yerde float()/np.asarray ile daraltılır.
[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true
