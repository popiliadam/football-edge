[project]
name = "football-edge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "protego>=0.3",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "defusedxml>=0.7",
    "typesafe-sdk>=0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "types-beautifulsoup4",
    "types-defusedxml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/football_edge"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["contract: kaydedilmiş fixture üzerinde tazelik/şema sözleşmesi"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "T20"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "scripts"]
